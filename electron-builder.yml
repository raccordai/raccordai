appId: ai.raccord.app
productName: Raccord
# No spaces (the NSIS default is "Raccord Setup X.Y.Z.exe"): these names end
# up as GitHub release asset URLs and in electron-updater's latest*.yml.
artifactName: '${productName}-${version}-${arch}.${ext}'
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
  # ffmpeg/ffprobe must be real executables on disk — they are spawned as
  # child processes (MP4 render) and can't run from inside the asar.
  - 'node_modules/ffmpeg-static/**'
  - 'node_modules/@ffprobe-installer/**'
extraResources:
  - from: drizzle
    to: drizzle
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
    # electron-updater installs from the zip on macOS (the dmg is download-only).
    - target: zip
      arch:
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
npmRebuild: true
# Auto-update feed (electron-updater): GitHub releases. publish-release.yml
# attaches binaries + latest*.yml to each release; the beta channel maps to
# GitHub prereleases (allowPrerelease in updater.ts), not to a channel file.
publish:
  provider: github
  owner: raccordai
  repo: raccordai
