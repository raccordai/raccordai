version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR per group keeps the noise manageable for a solo maintainer.
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    # Electron majors change the ABI (better-sqlite3 rebuild) — handle manually.
    ignore:
      - dependency-name: electron
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
