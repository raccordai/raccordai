name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs electron-builder install-app-deps, so better-sqlite3
      # is built for Electron's ABI — tests run through Electron's node
      # (ELECTRON_RUN_AS_NODE, see scripts/run-vitest.mjs).
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Coverage thresholds (vitest.config.ts) are enforced: the job fails
      # if covered scope drops below them.
      - run: pnpm test:coverage

      - run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The layer the unit suite leaves out on purpose: run engine, chat, IPC/MCP,
  # media protocol and the MP4 render — driven through Playwright against the
  # mocked kie.ai (no credits, no network). See e2e/README.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Electron's runtime deps + a virtual display: the app is a real window,
      # even headless. libasound is named libasound2t64 since Ubuntu 24.04.
      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # No keyring on this box: the harness launches Electron with
      # --password-store=basic AND sets RACCORD_E2E, which lets main fall back
      # to safeStorage's in-memory password (dev builds only) so the seeded kie
      # key can be stored at all.
      - run: xvfb-run --auto-servernum pnpm e2e
