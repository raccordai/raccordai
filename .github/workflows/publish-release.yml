# Builds the mac/windows/linux installers for a tagged release and attaches
# them to the GitHub release. Called by release-please.yml after each release;
# workflow_dispatch allows backfilling an existing tag (e.g. v0.2.0).
#
# Besides the versioned files, stable-named copies are uploaded so a website
# can link the newest build forever:
#   https://github.com/raccordai/raccordai/releases/latest/download/Raccord-mac.dmg
name: publish-release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach binaries to (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # NOTE: do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false here — in
    # electron-builder 26 it short-circuits findIdentity() before the
    # CSC_LINK keychain is even searched (no identity/CSC_NAME configured),
    # so macOS builds silently ship unsigned. Hosted runners have no other
    # identities, so auto-discovery only ever finds the CSC_LINK one.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # postinstall rebuilds better-sqlite3 for Electron's ABI on each OS.
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-vite build

      # macOS: signed (Developer ID .p12 in MAC_CSC_LINK) and notarized —
      # electron-builder triggers notarization when the APPLE_* vars are set,
      # and just warns/skips when they are absent (PR builds, forks).
      - run: pnpm exec electron-builder --publish=never
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

      # electron-builder only WARNS when signing/notarization is skipped, so a
      # green job can otherwise publish a build macOS reports as "damaged".
      - name: Fail if the macOS build is unsigned or not notarized
        if: matrix.os == 'macos-latest'
        run: |
          app=(dist/mac*/Raccord.app)
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep "Authority=Developer ID Application"
          xcrun stapler validate "$app"

          # ffmpeg/ffprobe are asarUnpack'd (they are spawned as child
          # processes by the MP4 render, see electron-builder.yml) and land as
          # loose Mach-O binaries under Resources. `--verify --deep` only
          # checks that they match the resource seal, so an unsigned one would
          # pass here and be rejected by the notary service — assert their own
          # Developer ID signature and hardened runtime explicitly.
          unpacked="$app/Contents/Resources/app.asar.unpacked/node_modules"
          for bin in \
            "$unpacked/ffmpeg-static/ffmpeg" \
            "$unpacked/ffprobe-static/bin/darwin/arm64/ffprobe"; do
            echo "checking $bin"
            test -x "$bin"
            codesign -dvv "$bin" 2>&1 | tee /tmp/sig.txt
            grep -q "Authority=Developer ID Application" /tmp/sig.txt
            grep -qE "flags=.*runtime" /tmp/sig.txt
          done

      - name: Alias binaries with stable names for /releases/latest/download links
        shell: bash
        run: |
          shopt -s nullglob
          for f in dist/*.dmg; do cp "$f" dist/Raccord-mac.dmg; done
          for f in dist/*.exe; do cp "$f" dist/Raccord-windows.exe; done
          for f in dist/*.AppImage; do cp "$f" dist/Raccord-linux.AppImage; done
          for f in dist/*.deb; do cp "$f" dist/Raccord-linux.deb; done

      # latest*.yml, blockmaps and the mac zip are what electron-updater
      # (github provider, see electron-builder.yml) reads and downloads.
      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload '${{ inputs.tag }}' \
            dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb \
            dist/*.blockmap dist/latest*.yml dist/beta*.yml --clobber
